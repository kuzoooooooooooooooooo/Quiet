[package]
name = "quiet-workspace"
version = "0.6.0"
description = "A small, local-first workspace"
edition = "2021"
rust-version = "1.85"

[lib]
name = "quiet_workspace"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "quiet-workspace"
path = "src/main.rs"
required-features = ["desktop"]

[features]
default = []
custom-protocol = ["desktop", "tauri/custom-protocol"]
desktop = ["dep:tauri", "dep:tauri-build", "dep:tauri-plugin-dialog", "dep:tauri-plugin-fs", "dep:tauri-plugin-opener", "dep:tauri-plugin-updater"]

[build-dependencies]
tauri-build = { version = "2", features = [], optional = true }

[dependencies]
rusqlite = { version = "0.37", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [], optional = true }
tauri-plugin-dialog = { version = "2", optional = true }
tauri-plugin-fs = { version = "2", optional = true }
tauri-plugin-opener = { version = "2", optional = true }
tauri-plugin-updater = { version = "2", optional = true }

[profile.dev]
debug = 0

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
panic = "abort"

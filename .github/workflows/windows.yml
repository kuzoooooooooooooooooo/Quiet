name: Build Windows

on:
  workflow_dispatch:
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    env:
      QUIET_UPDATER_PUBLIC_KEY: ${{ vars.TAURI_UPDATER_PUBLIC_KEY }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: npm ci

      - run: npm run desktop:build -- --bundles nsis -- --locked

      - uses: actions/upload-artifact@v4
        with:
          name: Quiet-Windows
          path: src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
